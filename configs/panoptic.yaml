
defaults:
  - _self_

hydra:
  run:
    dir: "experiments/panoptic/${now:%Y-%m-%d}/${now:%H-%M-%S}"

dataset:
  data_root: "data/panoptic"
  initial_guess: "triang_metrabs"
  poses_2d: "metrabs"
  start_scene_id: 0
  end_scene_id: -1 # total number of scenes in dataset
  frame_step: 1
  nviews: 4 # number of views to use for optimization

training:
  seed: 0
  quiet: true
  std_dev_noise: 0.0
  dropout: false
  accumulation_steps: 4
  loss_function: "l2_gaussian"
  lambda_loss_function: 0.05  # used only if loss function is combination of multiple losses
  consistency_loss: "3D_length_consistency" # none | limb_consistency
  lambda_consistency: 1e-5
  lambda_epipolar: 5e-4
  use_uncertainty_weighting: false
  uncertainty_mode: "full"
  uncertainty_temperature: 50.0
  uncertainty_min_weight: 0.05
  uncertainty_render_power: 1.0
  uncertainty_entropy_power: 1.0
  uncertainty_consistency_scale: 10.0
  hard_joint_adaptive_weighting: false
  hard_joint_topk: 4
  hard_joint_boost: 1.0
  hard_joint_momentum: 0.8
  hard_joint_conf_penalty_scale: 0.5
  hard_joint_warmup: 100
  reference_sampling_strategy: "random"
  reference_sampling_topk: 2
  reference_sampling_conf_power: 1.0
  reference_sampling_baseline_power: 1.0
  reference_sampling_reproj_scale: 25.0
  use_ema_teacher: false
  ema_decay: 0.995
  ema_warmup_start: 50
  ema_warmup_end: 150
  lambda_ema: 2e-4
  ema_use_root_relative: true
  ema_root_weight: 0.0
  use_temporal_sequence_prior: false
  temporal_mode: "velocity"
  lambda_temporal: 2e-4
  temporal_warmup_start: 100
  temporal_warmup_end: 200
  temporal_use_root_relative: true
  temporal_root_weight: 0.0
  temporal_max_gap_ratio: 1.5
  use_temporal_uncertainty_gating: false
  temporal_gate_topk: 4
  temporal_gate_conf_scale: 0.5
  temporal_gate_epi_scale: 1.0
  temporal_gate_min_conf: 1e-3
  use_pose_manifold_prior: false
  lambda_pose_manifold: 5e-5
  pose_manifold_warmup_start: 150
  pose_manifold_warmup_end: 250
  pose_bank_stride: 8
  pose_bank_max_samples: 4096
  pose_bank_root_relative: true
  pose_bank_cache: true
  pose_manifold_topk: 4
  pose_manifold_exclude_self: true
  epipolar_warmup_start: 0
  epipolar_warmup_end: 0
  epipolar_fusion_strength: 0.0
  epipolar_fusion_sigma: 6.0
  epipolar_fusion_conf_threshold: 0.05
  epipolar_fusion_min_views: 2
  epipolar_fusion_min_valid_ratio: 0.5
  epipolar_fusion_warmup: 0
  lambda_triangulation: 1e-4
  triangulation_warmup: 200
  triangulation_warmup_start: 200
  triangulation_warmup_end: 200
  xyz_only_warmup: 0
  triangulation_temperature: 50.0
  triangulation_min_view_weight: 0.05
  triangulation_min_views: 3
  triangulation_reproj_error: 8.0
  triangulation_endpoint_boost: 1.0
  lambda_symmetry_target: 5e-4
  symmetry_margin: 10.0
  lambda_ratio: 0.001
  ratio_margin: 0.05
  ratio_warmup: 200
  early_stopping: "no_stopping"  # opt_early_stopping | no_stopping

debug:
  save_iterations: [500]
  save_images: false

model:
  sh_degree: 1
  resolution: -1
  white_background: false
  train_test_exp: false
  data_device: "cuda"
  eval: false
  opacity_on: true
  scaling: 3
  scaling_modifier: 1.0

pipeline:
  rendering: diff-gaussian-rasterization-panoptic  # diff-gaussian-rasterization | diff-gaussian-rasterization-no-depth
  convert_SHs_python: false
  compute_cov3D_python: false
  debug: false
  antialiasing: false

optimization:
  iterations: 500
  position_lr_init: 0.005
  position_lr_final: 0.000005
  position_lr_delay_mult: 0.0
  position_lr_max_steps: 4000
  feature_lr: 0.0
  opacity_lr: 0.005
  scaling_lr: 0.005
  rotation_lr: 0.001
  exposure_lr_init: 0.01
  exposure_lr_final: 0.001
  exposure_lr_delay_steps: 0
  exposure_lr_delay_mult: 0.0
  percent_dense: 0.01
  lambda_dssim: 0.2
  densification_interval: 100
  opacity_reset_interval: 3000
  densify_from_iter: 500
  densify_until_iter: 15000
  densify_grad_threshold: 0.0002
  depth_l1_weight_init: 1.0
  depth_l1_weight_final: 0.01
  random_background: false
  optimizer_type: "default"
